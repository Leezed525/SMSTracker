data:
  train:
    datasets_name: [ "LasHeR_train", "DepthTrack_train", "VisEvent" ]
    #    datasets_name: [ "DepthTrack_train", "VisEvent" ]
    datasets_ratio: [ 1,1,1 ]
    sample_per_epoch: 60000
  val:
    datasets_name: [ "LasHeR_val", "DepthTrack_val", "VisEvent" ]
    #    datasets_name: [ "DepthTrack_val", "VisEvent" ]
    datasets_ratio: [ 1,1,1 ]
    sample_per_epoch: 10000
  sampler_mode: "causal"
  search:
    factor: 5.0
    size: 320
    center_jitter: 4.5
    scale_jitter: 0.5
    number: 1
  template:
    factor: 2.0
    size: 128
    center_jitter: 0
    scale_jitter: 0
    number: 1
  mean: [ 0.485, 0.456, 0.406 ]
  std: [ 0.229, 0.224, 0.225 ]
  max_sample_interval: 200
dataset:
  LasHeR:
    train:
      dir: /home/lzd/dataset/LasHeR/TrainingSet/trainingset
    val:
      dir: /home/lzd/dataset/LasHeR/TrainingSet/trainingset
  VisEvent:
    train:
      dir: /home/lzd/dataset/VisEvent/train/train_subset
    val:
      dir: /home/lzd/dataset/VisEvent/train/train_subset
  DepthTrack:
    train:
      dir: /home/lzd/dataset/DepthTrack/train
    val:
      dir: /home/lzd/dataset/DepthTrack/train
model:
  backbone:
    stride: 16
  pureRMT:
    embed_dim: [ 768,768,768,768 ]
    depth: [ 2,2,6,2 ]
    num_heads: [ 3,6,12,24 ]
    init_values: [ 1,1,1,1 ]
    head_ranges: [ 3,3,3,3 ]
    mlp_ratios: [ 3,3,3,3 ]
    chunkwise_recurrents: [ true,true,false,false ]
    drop_path_rate: 0.1
    combine_token_mode: "direct"
  head:
    num_channels: 256
train:
  model_name: 'SMSTracker'
  specifical_model_name: 'score_RMT_MLP'
  batch_size: 32
  num_worker: 16
  train_cls: false
  device: "cuda:1"
  print_interval: 10
  epoch: 1500
  lr: 0.001
  weight_decay: 0.0001
  optimizer: "ADAMW"
  lr_drop_epoch: 100
  GIOU_weight: 5.0
  L1_weight: 2.0
  scheduler:
    type: "step"
    decay_rate: 0.1
  save_epoch_interval: 1
  val_epoch_interval: 20
workspace:
  dir: /home/lzd/workspace/SMSTracker
  need_log: False
  log_file: "/home/lzd/workspace/SMSTracker/logs/LeeNet_plScore_RMT_CENTER_no_down/result.log"



